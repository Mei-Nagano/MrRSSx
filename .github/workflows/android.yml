name: Android APK

# Builds the installable Android packages without a local toolchain. The
# universal package covers phones (arm64-v8a) and emulators (x86_64); the
# phone-only package is smaller and is what a physical device should get.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  # Called by release.yml so a single dispatch produces every platform. On its own
  # a manual release built only the desktop targets, and the APKs needed a second run.
  workflow_call:
    inputs:
      release_tag:
        description: Release tag selected by the parent release workflow
        required: false
        type: string

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A named release must build from its tag. The rolling `latest` tag may
          # point at an older commit, so use the caller's current commit for it
          # and for standalone dispatches/tag pushes.
          ref: ${{ inputs.release_tag != '' && inputs.release_tag != 'latest' && inputs.release_tag || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          # The runner image ships the SDK and its licences; the setup-android
          # action is not used because it installs the retired "tools" package
          # and fails. Pick its sdkmanager instead of relying on PATH.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          fi
          echo "Using $SDKMANAGER"
          NDK_VERSION="29.0.14206865"
          "$SDKMANAGER" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" \
            > /dev/null
          # package.sh reads ANDROID_NDK_HOME first.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Make Gradle wrapper executable
        run: chmod +x build/android/gradlew

      - name: Build universal APK
        run: bash build/android/package.sh --abi all

      - name: Build arm64 APK
        run: bash build/android/package.sh --abi arm64

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mrrss-android
          path: |
            build/bin/MrRSS.apk
            build/bin/MrRSS-arm64-v8a.apk
          if-no-files-found: error
          # The same APKs are published to the release below; this copy only serves
          # the run page, so it does not need the default retention.
          retention-days: 7

      # A parent release supplies the exact tag to publish. Standalone tag pushes
      # use their real tag; a manual branch dispatch keeps the rolling `latest`
      # behavior and never changes which commit that tag points to.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          FILES=(build/bin/MrRSS.apk build/bin/MrRSS-arm64-v8a.apk)
          TAG=""
          if [ -n "${RELEASE_TAG:-}" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          fi

          if [ -n "$TAG" ]; then
            # Keep the tag as one quoted argument and reject option-like input.
            if [[ "$TAG" == -* || "$TAG" == *$'\n'* || "$TAG" == *$'\r'* ]]; then
              echo "Invalid release tag"
              exit 1
            fi
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "${FILES[@]}" --clobber
            elif ! gh release create "$TAG" --title "$TAG" --generate-notes "${FILES[@]}" 2>/dev/null; then
              # release.yml runs on the same tag and may have created the release
              # between the check and the create; upload into that one instead of
              # failing the whole job.
              gh release upload "$TAG" "${FILES[@]}" --clobber
            fi
          else
            NOTES="$(printf 'Android packages built by GitHub Actions from `%s`.\n\n- `MrRSS-arm64-v8a.apk` — phones (arm64-v8a), signed with the debug keystore\n- `MrRSS.apk` — universal (arm64-v8a + x86_64), emulators included\n\nInstall with `adb install -r MrRSS-arm64-v8a.apk`.' "$GITHUB_SHA")"
            if gh release view latest > /dev/null 2>&1; then
              gh release upload latest "${FILES[@]}" --clobber
              gh release edit latest --notes "$NOTES"
            else
              gh release create latest --title "Latest Android build" --prerelease \
                --target "$GITHUB_SHA" --notes "$NOTES" "${FILES[@]}"
            fi
          fi
